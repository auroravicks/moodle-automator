[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "moodle-lms-automation"
version = "0.1.0"
description = "Cross-platform Moodle material, live-lecture, and assignment collector"
requires-python = ">=3.11"
dependencies = [
  "click>=8.1,<9",
  "python-dotenv>=1.0,<2",
  "playwright>=1.50,<2",
  "PyYAML>=6.0,<7",
  "tzdata>=2025.2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[project.scripts]
moodle-lms-automation = "lms_collector.cli:cli"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
