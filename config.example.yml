lms:
  base_url: https://moodle.example.edu

storage:
  internal_dir: class-notes
  resources_dir: ../Resources
  auth_state_path: null

browser:
  headless: true
  # null uses Playwright's bundled Chromium on every supported platform.
  # Set to chrome, msedge, or another installed Playwright channel if desired.
  channel: null
  profile_dir: class-notes/browser-profile

logging:
  level: INFO
  directory: logs
  max_bytes: 2097152
  backup_count: 5

locale:
  timezone: UTC

deadlines:
  reminder_hours: [72, 24, 3]
  digest_windows_days:
    urgent: 2
    upcoming: 7
  include_other_activity_types: false

notifications:
  google_chat:
    enabled: false
    deduplicate: false
    live_lecture_days: 7
    excluded_courses: []
